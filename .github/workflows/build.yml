name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk JoyGPS.apk

      - uses: actions/upload-artifact@v4
        with:
          name: JoyGPS-debug-apk
          path: JoyGPS.apk

      # Publishes the APK at a stable, phone-friendly link:
      # https://github.com/<owner>/<repo>/releases/latest/download/JoyGPS.apk
      - name: Publish "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest JoyGPS.apk \
            --title "JoyGPS (latest build)" \
            --notes "Debug APK built from commit ${GITHUB_SHA::7}. Download JoyGPS.apk below and open it on your phone to install." \
            --target "$GITHUB_SHA" \
            --latest
